<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Imane | Bac National 2027</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;

    font-family: Georgia, "Times New Roman", serif;

    background:
        linear-gradient(
            rgba(10, 5, 35, 0.18),
            rgba(10, 5, 35, 0.18)
        ),
        url("background.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    color: white;
}


/* طبقة خفيفة فوق الخلفية */

body::after {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            transparent 25%,
            rgba(8, 4, 35, 0.35) 100%
        );

    pointer-events: none;
    z-index: 1;
}


/* المحتوى */

.container {
    position: relative;
    z-index: 5;

    width: 90%;
    max-width: 900px;

    margin: auto;
    padding-top: 8vh;

    text-align: center;
}


/* الاسم */

.name {
    font-size: 19px;

    letter-spacing: 6px;

    color: #e8b9e9;

    margin-bottom: 8px;

    text-shadow:
        0 0 8px #d77be9;

    animation: nameGlow 3s ease-in-out infinite;
}


/* العنوان */

h1 {
    margin: 0;

    font-size: clamp(38px, 6vw, 72px);

    color: white;

    text-shadow:
        0 0 8px white,
        0 0 18px #9b83ff,
        0 0 35px #775cff;

    animation: titleFloat 4s ease-in-out infinite;
}


/* الجملة */

.subtitle {
    margin-top: 12px;
    margin-bottom: 25px;

    font-size: 17px;

    color: #eee0ff;

    text-shadow: 0 0 8px #9e72d9;
}


/* الصندوق ديال countdown */

.countdown {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 16px;

    max-width: 780px;

    margin: auto;
}


/* boxes */

.box {
    padding: 20px 10px;

    border-radius: 20px;

    background:
        rgba(43, 27, 91, 0.72);

    border: 1px solid
        rgba(225, 190, 255, 0.45);

    backdrop-filter: blur(12px);

    box-shadow:
        0 0 18px rgba(150, 100, 255, 0.22),
        inset 0 0 15px rgba(255,255,255,0.04);

    transition: 0.35s ease;

    animation: boxFloat 4s ease-in-out infinite;
}


.box:hover {
    transform:
        translateY(-8px)
        scale(1.04);

    box-shadow:
        0 0 30px rgba(190, 130, 255, 0.45);
}


.box:nth-child(2) {
    animation-delay: .3s;
}

.box:nth-child(3) {
    animation-delay: .6s;
}

.box:nth-child(4) {
    animation-delay: .9s;
}


/* الأرقام */

.number {
    font-size: clamp(35px, 5vw, 58px);

    font-weight: bold;

    color: #c8ddff;

    text-shadow:
        0 0 8px #8bbcff,
        0 0 20px #7187ff,
        0 0 35px #6670ff;

    animation: numberGlow 2.5s ease-in-out infinite;
}


/* الكلمات */

.label {
    margin-top: 8px;

    font-size: 13px;

    letter-spacing: 3px;

    color: #eadfff;
}


/* الجملة الأخيرة */

.message {
    margin-top: 25px;

    font-size: 17px;

    color: #e8c7ff;

    text-shadow:
        0 0 10px #b66cff;

    animation: softGlow 3s ease-in-out infinite;
}


/* 🌸❄️ الورود والثلج */

.particle {
    position: fixed;

    top: -50px;

    z-index: 10;

    pointer-events: none;

    user-select: none;

    animation:
        fall linear forwards,
        sway ease-in-out infinite;
}


@keyframes fall {

    from {
        transform:
            translateY(-60px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(360deg);
    }

}


@keyframes sway {

    0%, 100% {
        margin-left: 0;
    }

    50% {
        margin-left: 60px;
    }

}


/* حركة العنوان */

@keyframes titleFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }

}


/* حركة الاسم */

@keyframes nameGlow {

    0%, 100% {
        opacity: .65;
    }

    50% {
        opacity: 1;
    }

}


/* حركة الأرقام */

@keyframes numberGlow {

    0%, 100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.25);
    }

}


/* حركة boxes */

@keyframes boxFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }

}


/* glow */

@keyframes softGlow {

    0%, 100% {
        opacity: .7;
    }

    50% {
        opacity: 1;
    }

}


/* الهاتف */

@media (max-width: 700px) {

    .container {
        padding-top: 7vh;
    }

    .countdown {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .box {
        padding: 15px 5px;
    }

    .name {
        font-size: 14px;
    }

    .subtitle {
        font-size: 14px;
    }

    .message {
        font-size: 14px;
    }

}

</style>
</head>


<body>


<div class="container">

    <div class="name">
        IMANE ♡
    </div>


    <h1>
        🎓 Bac National 2027
    </h1>


    <div class="subtitle">

        ✦ Les grands rêves commencent par de petits efforts... ✦

        <br>

        ⏳ Countdown jusqu'au 1er juin 2027

    </div>


    <div class="countdown">


        <div class="box">

            <div
                class="number"
                id="days">
                0
            </div>

            <div class="label">
                JOURS
            </div>

        </div>


        <div class="box">

            <div
                class="number"
                id="hours">
                00
            </div>

            <div class="label">
                HEURES
            </div>

        </div>


        <div class="box">

            <div
                class="number"
                id="minutes">
                00
            </div>

            <div class="label">
                MINUTES
            </div>

        </div>


        <div class="box">

            <div
                class="number"
                id="seconds">
                00
            </div>

            <div class="label">
                SECONDES
            </div>

        </div>


    </div>


    <div class="message">

        ✦ Chaque seconde te rapproche de ton objectif ✦

    </div>

</div>



<script>


/* التاريخ ديال الوطني */

const examDate =
    new Date("2027-06-01T00:00:00").getTime();


function updateCountdown() {


    const now =
        new Date().getTime();


    const difference =
        examDate - now;


    if (difference <= 0) {

        document.getElementById("days")
            .textContent = "0";

        document.getElementById("hours")
            .textContent = "00";

        document.getElementById("minutes")
            .textContent = "00";

        document.getElementById("seconds")
            .textContent = "00";

        return;
    }


    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (difference /
            (1000 * 60 * 60)) % 24
        );


    const minutes =
        Math.floor(
            (difference /
            (1000 * 60)) % 60
        );


    const seconds =
        Math.floor(
            (difference / 1000) % 60
        );


    document.getElementById("days")
        .textContent = days;


    document.getElementById("hours")
        .textContent =
        String(hours).padStart(2, "0");


    document.getElementById("minutes")
        .textContent =
        String(minutes).padStart(2, "0");


    document.getElementById("seconds")
        .textContent =
        String(seconds).padStart(2, "0");

}


updateCountdown();


setInterval(
    updateCountdown,
    1000
);



/* 🌸❄️ particles */

const particles = [

    "🌸",
    "🌸",
    "🌹",
    "🌸",
    "❄️",
    "❄",
    "✦",
    "✧"

];


function createParticle() {


    const particle =
        document.createElement("div");


    particle.className =
        "particle";


    particle.textContent =
        particles[
            Math.floor(
                Math.random() *
                particles.length
            )
        ];


    /* الجوانب */

    if (Math.random() < 0.5) {

        particle.style.left =
            (Math.random() * 25) + "vw";

    } else {

        particle.style.left =
            (75 + Math.random() * 25) + "vw";

    }


    particle.style.fontSize =
        (12 + Math.random() * 16) + "px";


    const duration =
        7 + Math.random() * 8;


    particle.style.animationDuration =
        duration + "s, " +
        (2 + Math.random() * 3) + "s";


    document.body.appendChild(
        particle
    );


    setTimeout(
        () => particle.remove(),
        duration * 1000
    );

}


setInterval(
    createParticle,
    450
);


</script>


</body>

</html>
