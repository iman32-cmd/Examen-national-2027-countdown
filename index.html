<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IMANE ♡ | Bac National 2027</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    font-family: Georgia, "Times New Roman", serif;

    background:
        #10082f url("background.png")
        center / cover no-repeat;

    color: white;
}


/* طبقة غوزية فوق الصورة */

.overlay {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(112, 65, 180, 0.28),
            rgba(12, 5, 40, 0.48) 70%
        );

    z-index: 1;
}


/* بريق متحرك */

.sparkles {
    position: fixed;
    inset: 0;

    z-index: 8;

    pointer-events: none;
}

.sparkle {
    position: absolute;

    color: white;

    font-size: 18px;

    text-shadow:
        0 0 5px white,
        0 0 15px #d59cff;

    animation: sparkle 2.5s ease-in-out infinite;
}


/* المحتوى */

.container {
    position: relative;

    z-index: 10;

    width: 90%;
    max-width: 900px;

    margin: auto;

    padding-top: 8vh;

    text-align: center;
}


/* الاسم */

.name {
    font-size: 18px;

    letter-spacing: 6px;

    color: #e8b9ed;

    margin-bottom: 8px;

    text-shadow:
        0 0 8px #d78cff;

    animation: glow 3s infinite;
}


/* العنوان */

h1 {
    margin: 0;

    font-size: clamp(38px, 6vw, 70px);

    color: white;

    text-shadow:
        0 0 7px white,
        0 0 18px #b38cff,
        0 0 38px #815cff;

    animation: float 4s ease-in-out infinite;
}


/* النص */

.subtitle {
    margin-top: 12px;
    margin-bottom: 28px;

    font-size: 17px;

    color: #eee2ff;

    text-shadow:
        0 0 10px #aa7bdf;
}


/* countdown */

.countdown {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 16px;

    max-width: 790px;

    margin: auto;
}


/* boxes */

.box {
    padding: 21px 10px;

    border-radius: 21px;

    background:
        rgba(35, 20, 82, 0.72);

    border:
        1px solid
        rgba(225, 194, 255, 0.42);

    backdrop-filter: blur(14px);

    box-shadow:
        0 0 22px
        rgba(153, 102, 255, 0.28),

        inset 0 0 15px
        rgba(255,255,255,.04);

    animation:
        boxFloat 4s ease-in-out infinite;

    transition: .3s;
}


.box:hover {
    transform:
        translateY(-8px)
        scale(1.03);

    box-shadow:
        0 0 35px
        rgba(197, 144, 255, .5);
}


.box:nth-child(2) {
    animation-delay: .25s;
}

.box:nth-child(3) {
    animation-delay: .5s;
}

.box:nth-child(4) {
    animation-delay: .75s;
}


/* الأرقام */

.number {
    font-size: clamp(36px, 5vw, 59px);

    font-weight: bold;

    color: #c8ddff;

    text-shadow:
        0 0 8px #a7caff,
        0 0 20px #7894ff,
        0 0 35px #6d6fff;

    animation: numberGlow 2.5s infinite;
}


/* الكلمات */

.label {
    margin-top: 7px;

    font-size: 12px;

    letter-spacing: 3px;

    color: #eee5ff;
}


/* الرسالة */

.message {
    margin-top: 26px;

    font-size: 18px;

    color: #e8caff;

    text-shadow:
        0 0 10px #b875ff;

    animation: glow 3s infinite;
}


/* 🌸 ورود صغيرة طائرة */

.flower {
    position: fixed;

    z-index: 7;

    top: -30px;

    pointer-events: none;

    animation:
        fall linear forwards,
        sway ease-in-out infinite;
}


@keyframes fall {

    from {
        transform:
            translateY(-40px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(360deg);
    }
}


@keyframes sway {

    0%, 100% {
        margin-left: 0;
    }

    50% {
        margin-left: 55px;
    }
}


/* ✨ البريق */

@keyframes sparkle {

    0%, 100% {
        opacity: .15;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.35);
    }
}


/* حركة العنوان */

@keyframes float {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}


/* حركة الصناديق */

@keyframes boxFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }
}


/* Glow */

@keyframes glow {

    0%, 100% {
        opacity: .7;
    }

    50% {
        opacity: 1;
    }
}


/* Glow الأرقام */

@keyframes numberGlow {

    0%, 100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.3);
    }
}


/* الهاتف */

@media (max-width: 700px) {

    .countdown {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;
    }

    .container {
        padding-top: 7vh;
    }

    .name {
        font-size: 14px;
    }

    .subtitle {
        font-size: 13px;
    }

    .message {
        font-size: 14px;
    }
}

</style>
</head>


<body>


<div class="overlay"></div>


<!-- ✨ البريق -->

<div class="sparkles">

    <span class="sparkle"
          style="left:7%;top:16%;">
        ✦
    </span>

    <span class="sparkle"
          style="left:18%;top:65%;animation-delay:1s;">
        ✧
    </span>

    <span class="sparkle"
          style="left:33%;top:12%;animation-delay:.5s;">
        ✦
    </span>

    <span class="sparkle"
          style="left:70%;top:16%;animation-delay:1.4s;">
        ✧
    </span>

    <span class="sparkle"
          style="left:87%;top:30%;animation-delay:.8s;">
        ✦
    </span>

    <span class="sparkle"
          style="left:91%;top:76%;animation-delay:1.7s;">
        ✧
    </span>

</div>


<!-- المحتوى -->

<div class="container">


    <div class="name">
        IMANE ♡
    </div>


    <h1>
        🎓 Bac National 2027
    </h1>


    <div class="subtitle">

        ✦ Les grands rêves commencent par de petits efforts... ✦

        <br>

        ⏳ Countdown jusqu'au 1er juin 2027

    </div>


    <div class="countdown">


        <div class="box">

            <div
                class="number"
                id="days">
                0
            </div>

            <div class="label">
                JOURS
            </div>

        </div>


        <div class="box">

            <div
                class="number"
                id="hours">
                00
            </div>

            <div class="label">
                HEURES
            </div>

        </div>


        <div class="box">

            <div
                class="number"
                id="minutes">
                00
            </div>

            <div class="label">
                MINUTES
            </div>

        </div>


        <div class="box">

            <div
                class="number"
                id="seconds">
                00
            </div>

            <div class="label">
                SECONDES
            </div>

        </div>


    </div>


    <div class="message">

        ✦ Chaque seconde te rapproche de ton objectif ✦

    </div>


</div>


<script>


/* ⏳ Countdown */

const examDate =
    new Date(
        "2027-06-01T00:00:00"
    ).getTime();


function updateCountdown() {

    const now =
        new Date().getTime();

    const difference =
        examDate - now;


    if (difference <= 0) {

        days.textContent = "0";

        hours.textContent = "00";

        minutes.textContent = "00";

        seconds.textContent = "00";

        return;
    }


    const d =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const h =
        Math.floor(
            (difference /
            (1000 * 60 * 60)) % 24
        );


    const m =
        Math.floor(
            (difference /
            (1000 * 60)) % 60
        );


    const s =
        Math.floor(
            (difference / 1000) % 60
        );


    document.getElementById("days")
        .textContent = d;


    document.getElementById("hours")
        .textContent =
        String(h).padStart(2, "0");


    document.getElementById("minutes")
        .textContent =
        String(m).padStart(2, "0");


    document.getElementById("seconds")
        .textContent =
        String(s).padStart(2, "0");

}


updateCountdown();

setInterval(
    updateCountdown,
    1000
);



/* 🌸❄️ ورود وثلج */

const particles = [
    "🌸",
    "🌸",
    "🌹",
    "❄",
    "❄",
    "✦",
    "✧"
];


function createFlower() {

    const el =
        document.createElement("div");

    el.className = "flower";

    el.textContent =
        particles[
            Math.floor(
                Math.random() *
                particles.length
            )
        ];


    /*
       نخليهم يخرجو
       بزاف من الجوانب
    */

    if (Math.random() < .5) {

        el.style.left =
            Math.random() * 20 + "vw";

    } else {

        el.style.left =
            80 + Math.random() * 20 + "vw";

    }


    el.style.fontSize =
        12 + Math.random() * 15 + "px";


    const duration =
        7 + Math.random() * 7;


    el.style.animationDuration =
        duration + "s, " +
        (2 + Math.random() * 2) + "s";


    document.body.appendChild(el);


    setTimeout(
        () => el.remove(),
        duration * 1000
    );

}


setInterval(
    createFlower,
    500
);


</script>

</body>

</html>
