<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Imane | Bac National 2027</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;

    font-family: Georgia, "Times New Roman", serif;
    color: white;

    background:
        radial-gradient(circle at 50% 40%, #4b3a91 0%, transparent 35%),
        radial-gradient(circle at 10% 80%, #7b3c83 0%, transparent 30%),
        radial-gradient(circle at 90% 15%, #593b91 0%, transparent 28%),
        linear-gradient(135deg, #090827, #171044, #29154d, #090827);

    display: flex;
    justify-content: center;
    align-items: center;
}


/* 🌌 حركة خفيفة للخلفية */

body::before {
    content: "";
    position: fixed;
    inset: -20%;

    background:
        radial-gradient(circle at 30% 30%,
        rgba(255,180,245,.12),
        transparent 20%),

        radial-gradient(circle at 70% 60%,
        rgba(160,140,255,.12),
        transparent 22%);

    animation: backgroundMove 12s ease-in-out infinite alternate;

    pointer-events: none;
}


/* ✨ البريق */

.sparkles {
    position: fixed;
    inset: 0;

    pointer-events: none;
    z-index: 2;
}


.sparkle {
    position: absolute;

    color: #fff;

    text-shadow:
        0 0 6px #fff,
        0 0 15px #d9b5ff;

    animation: sparkle 3s ease-in-out infinite;
}


/* المحتوى */

.container {
    position: relative;
    z-index: 5;

    width: 90%;
    max-width: 900px;

    text-align: center;
}


/* الاسم */

.name {
    font-size: 19px;

    letter-spacing: 6px;

    color: #e6b8e8;

    margin-bottom: 8px;

    text-shadow:
        0 0 8px #d889e8;

    animation: glow 3s ease-in-out infinite;
}


/* العنوان */

h1 {
    margin: 0;

    font-size: clamp(40px, 6vw, 72px);

    color: white;

    text-shadow:
        0 0 8px white,
        0 0 20px #a48cff,
        0 0 40px #765cff;

    animation: titleFloat 4s ease-in-out infinite;
}


/* النص */

.subtitle {
    margin-top: 14px;
    margin-bottom: 30px;

    font-size: 17px;

    color: #eadfff;

    text-shadow:
        0 0 8px #a984df;
}


/* Countdown */

.countdown {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 17px;

    max-width: 800px;

    margin: auto;
}


/* الصناديق */

.box {
    padding: 22px 10px;

    border-radius: 22px;

    background:
        rgba(67, 48, 120, .38);

    border:
        1px solid rgba(225, 205, 255, .35);

    backdrop-filter: blur(12px);

    box-shadow:
        0 0 20px rgba(130, 100, 255, .20),
        inset 0 0 18px rgba(255,255,255,.04);

    transition: .3s ease;

    animation: boxFloat 4s ease-in-out infinite;
}


.box:hover {
    transform:
        translateY(-7px)
        scale(1.03);

    box-shadow:
        0 0 30px rgba(190,150,255,.4);
}


.box:nth-child(2) {
    animation-delay: .3s;
}

.box:nth-child(3) {
    animation-delay: .6s;
}

.box:nth-child(4) {
    animation-delay: .9s;
}


/* الأرقام */

.number {
    font-size: clamp(38px, 5vw, 60px);

    font-weight: bold;

    color: #c9ddff;

    text-shadow:
        0 0 8px #9ac5ff,
        0 0 20px #778bff,
        0 0 35px #6870ff;

    animation: numberGlow 2.5s ease-in-out infinite;
}


/* الكلمات */

.label {
    margin-top: 8px;

    font-size: 13px;

    letter-spacing: 3px;

    color: #eee5ff;
}


/* الرسالة */

.message {
    margin-top: 28px;

    font-size: 18px;

    color: #e7c9ff;

    text-shadow:
        0 0 10px #b979ff;

    animation: glow 3s ease-in-out infinite;
}


/* 🌌 حركة الخلفية */

@keyframes backgroundMove {

    0% {
        transform: translate(0, 0) scale(1);
    }

    50% {
        transform: translate(2%, -2%) scale(1.05);
    }

    100% {
        transform: translate(-2%, 2%) scale(1);
    }

}


/* العنوان */

@keyframes titleFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }

}


/* الصناديق */

@keyframes boxFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }

}


/* بريق الأرقام */

@keyframes numberGlow {

    0%, 100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.3);
    }

}


/* ✨ البريق */

@keyframes sparkle {

    0%, 100% {
        opacity: .15;
        transform: scale(.7) rotate(0deg);
    }

    50% {
        opacity: 1;
        transform: scale(1.3) rotate(25deg);
    }

}


/* Glow */

@keyframes glow {

    0%, 100% {
        opacity: .7;
    }

    50% {
        opacity: 1;
    }

}


/* الهاتف */

@media (max-width: 700px) {

    .countdown {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .name {
        font-size: 14px;
    }

    .subtitle {
        font-size: 14px;
    }

    .message {
        font-size: 14px;
    }

}

</style>
</head>


<body>


<!-- ✨ البريق -->

<div class="sparkles">

    <span class="sparkle" style="left:8%; top:15%; animation-delay:0s;">✦</span>

    <span class="sparkle" style="left:18%; top:72%; animation-delay:1s;">✧</span>

    <span class="sparkle" style="left:32%; top:12%; animation-delay:1.8s;">✦</span>

    <span class="sparkle" style="left:48%; top:82%; animation-delay:.5s;">✧</span>

    <span class="sparkle" style="left:65%; top:18%; animation-delay:1.3s;">✦</span>

    <span class="sparkle" style="left:78%; top:70%; animation-delay:2s;">✧</span>

    <span class="sparkle" style="left:91%; top:25%; animation-delay:.8s;">✦</span>

    <span class="sparkle" style="left:87%; top:85%; animation-delay:1.5s;">✧</span>

</div>


<!-- المحتوى -->

<div class="container">


    <div class="name">
        IMANE ♡
    </div>


    <h1>
        🎓 Bac National 2027
    </h1>


    <div class="subtitle">

        ✦ Les grands rêves commencent par de petits efforts... ✦

        <br>

        ⏳ Countdown jusqu'au 1er juin 2027

    </div>


    <div class="countdown">


        <div class="box">

            <div class="number" id="days">
                0
            </div>

            <div class="label">
                JOURS
            </div>

        </div>


        <div class="box">

            <div class="number" id="hours">
                00
            </div>

            <div class="label">
                HEURES
            </div>

        </div>


        <div class="box">

            <div class="number" id="minutes">
                00
            </div>

            <div class="label">
                MINUTES
            </div>

        </div>


        <div class="box">

            <div class="number" id="seconds">
                00
            </div>

            <div class="label">
                SECONDES
            </div>

        </div>


    </div>


    <div class="message">

        ✦ Chaque seconde te rapproche de ton objectif ✦

    </div>


</div>



<script>


/* ⏳ Countdown jusqu'au 1 juin 2027 */

const examDate =
    new Date("2027-06-01T00:00:00").getTime();


function updateCountdown() {

    const now =
        new Date().getTime();

    const difference =
        examDate - now;


    if (difference <= 0) {

        document.getElementById("days").textContent = "0";

        document.getElementById("hours").textContent = "00";

        document.getElementById("minutes").textContent = "00";

        document.getElementById("seconds").textContent = "00";

        return;
    }


    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (difference /
            (1000 * 60 * 60)) % 24
        );


    const minutes =
        Math.floor(
            (difference /
            (1000 * 60)) % 60
        );


    const seconds =
        Math.floor(
            (difference / 1000) % 60
        );


    document.getElementById("days")
        .textContent = days;


    document.getElementById("hours")
        .textContent =
        String(hours).padStart(2, "0");


    document.getElementById("minutes")
        .textContent =
        String(minutes).padStart(2, "0");


    document.getElementById("seconds")
        .textContent =
        String(seconds).padStart(2, "0");

}


updateCountdown();

setInterval(updateCountdown, 1000);

</script>


</body>

</html>
