<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bac National 2027</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;

            background: linear-gradient(
                135deg,
                #071a33,
                #123b68,
                #071a33
            );

            background-size: 300% 300%;
            animation: backgroundMove 10s ease infinite;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: clamp(32px, 6vw, 60px);
            margin: 0 0 12px;

            animation: titleFloat 3s ease-in-out infinite;
        }

        .subtitle {
            color: #9dd9ff;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .box {
            padding: 25px 10px;
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.20);

            backdrop-filter: blur(10px);

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .box:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
        }

        .number {
            font-size: clamp(35px, 6vw, 60px);
            font-weight: bold;
            color: #4db8ff;

            animation: numberGlow 2s ease-in-out infinite;
        }

        .label {
            margin-top: 8px;
            font-size: 14px;
            color: #d9ecff;
        }

        .message {
            margin-top: 30px;
            font-size: 17px;
            color: #b9dcf7;
        }

        /* حركة الخلفية */
        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* حركة العنوان */
        @keyframes titleFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        /* إضاءة الأرقام */
        @keyframes numberGlow {
            0%, 100% {
                text-shadow: 0 0 5px rgba(77, 184, 255, 0.2);
            }

            50% {
                text-shadow: 0 0 18px rgba(77, 184, 255, 0.7);
            }
        }

        /* الهاتف */
        @media (max-width: 600px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }

            .box {
                padding: 20px 8px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎓 Bac National 2027</h1>

        <div class="subtitle">
            ⏳ Countdown jusqu'au 1er juin 2027
        </div>

        <div class="countdown">

            <div class="box">
                <div class="number" id="days">0</div>
                <div class="label">JOURS</div>
            </div>

            <div class="box">
                <div class="number" id="hours">00</div>
                <div class="label">HEURES</div>
            </div>

            <div class="box">
                <div class="number" id="minutes">00</div>
                <div class="label">MINUTES</div>
            </div>

            <div class="box">
                <div class="number" id="seconds">00</div>
                <div class="label">SECONDES</div>
            </div>

        </div>

        <div class="message">
            ✨ Chaque seconde te rapproche de ton objectif ✨
        </div>

    </div>


    <script>

        const examDate = new Date("2027-06-01T00:00:00").getTime();

        function updateCountdown() {

            const now = new Date().getTime();

            const difference = examDate - now;

            if (difference <= 0) {

                document.getElementById("days").textContent = "0";
                document.getElementById("hours").textContent = "00";
                document.getElementById("minutes").textContent = "00";
                document.getElementById("seconds").textContent = "00";

                document.querySelector(".subtitle").textContent =
                    "🎓 C'est le jour du Bac National !";

                return;
            }

            const days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (difference / (1000 * 60 * 60)) % 24
            );

            const minutes = Math.floor(
                (difference / (1000 * 60)) % 60
            );

            const seconds = Math.floor(
                (difference / 1000) % 60
            );

            document.getElementById("days").textContent = days;

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);

    </script>

</body>

</html>
